name: Windows CI (fork)

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      SOLUTION: vsprojects/pcsx-redux.sln
      CONFIG: ReleaseWithClangCL
      PLATFORM: x64
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore $env:SOLUTION

      - name: Build solution
        # We build the two app targets (pcsx-redux/mainthunk + pcsx-wrapper) directly
        # via .vcxproj instead of through the .sln, because msbuild's sln metaproj
        # target naming is unreliable here:
        #   - "/t:pcsx_redux"           -> MSB4057 (interpreted as a verb, CI #4)
        #   - "/t:pcsx_redux:Build"     -> MSB4057 (target not found in metaproj, CI #5)
        #   probably because the .sln has both a folder named "pcsx-redux" and a
        #   project named "pcsx-redux" sharing the metaproj namespace.
        # Direct .vcxproj invocation skips the metaproj and msbuild still resolves
        # transitive ProjectReferences, so core/gui/fmt/... build automatically.
        # SolutionDir is required because many .vcxproj reference $(SolutionDir).
        # NuGet restore (above) populates vsprojects/packages/ at the sln level; that
        # cache works for direct .vcxproj builds as well.
        #
        # /p:PlatformToolset=v143 overrides v145 (VS 2026) declarations in tracy /
        # uriparser .vcxproj. windows-2022 runner only ships v143; v145 lives on
        # Azure DevOps' vs2026 image (which is what upstream uses).
        #
        # Test projects (testsupport / pcsxrunner / memoryleakdetector) are skipped
        # because they hit LNK1561 under ClangCL+v143 (the v140 googletest NuGet's
        # auto-link logic for gtest_main does not match this toolset combination).
        # Phase 3 verification needs only the emulator binary, not the test suite.
        run: |
          $sd = "$PWD\vsprojects\"
          msbuild vsprojects/mainthunk/mainthunk.vcxproj    /p:Configuration=$env:CONFIG /p:Platform=$env:PLATFORM /p:PlatformToolset=v143 /p:SolutionDir=$sd /m
          if ($LASTEXITCODE -ne 0) { throw "mainthunk build failed" }
          msbuild vsprojects/pcsx-wrapper/pcsx-wrapper.vcxproj /p:Configuration=$env:CONFIG /p:Platform=$env:PLATFORM /p:PlatformToolset=v143 /p:SolutionDir=$sd /m
          if ($LASTEXITCODE -ne 0) { throw "pcsx-wrapper build failed" }

      - name: Stage binaries (rename wrapper to main entry)
        shell: pwsh
        run: |
          $out = "vsprojects/$env:PLATFORM/$env:CONFIG"
          if (Test-Path "$out/pcsx-redux.exe")  { Rename-Item "$out/pcsx-redux.exe"  "pcsx-redux.main" -Force }
          if (Test-Path "$out/pcsx-wrapper.exe") { Rename-Item "$out/pcsx-wrapper.exe" "pcsx-redux.exe"   -Force }
          mkdir artifacts | Out-Null
          Copy-Item "$out/*.exe" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$out/*.dll" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$out/pcsx-redux.main" artifacts/ -ErrorAction SilentlyContinue
          if (Test-Path third_party/SDL_GameControllerDB/gamecontrollerdb.txt) {
            Copy-Item third_party/SDL_GameControllerDB/gamecontrollerdb.txt artifacts/
          }
          Copy-Item third_party/noto/* artifacts/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-redux-windows-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
