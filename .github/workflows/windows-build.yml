name: Windows CI (fork)

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      SOLUTION: vsprojects/pcsx-redux.sln
      CONFIG: ReleaseWithClangCL
      PLATFORM: x64
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore $env:SOLUTION

      - name: Build solution
        # /p:PlatformToolset=v143 forces VS 2022 toolset, overriding any v145 (VS 2026)
        # references in individual vcxproj files (tracy/uriparser). The GitHub-hosted
        # windows-2022 runner only ships v143; v145 lives on Azure DevOps' vs2026 image.
        #
        # /t:pcsx_redux:Build;pcsx_wrapper:Build limits the build to the two app
        # targets we ship (the renamed pcsx-redux.main + pcsx-redux.exe wrapper) plus
        # their transitive ProjectReferences (core, gui, fmt, ...). The hyphenated sln
        # project names are escaped to underscores per msbuild rules, and ":Build" is
        # required so msbuild interprets them as project specifiers rather than as
        # MSBuild target verbs (verb-only "/t:pcsx_redux" produced MSB4057 in CI #4).
        # Test projects (testsupport / pcsxrunner / memoryleakdetector) are skipped:
        # they hit LNK1561 under ClangCL+v143 because the v140 googletest NuGet's
        # auto-link logic for gtest_main does not match this toolset combination.
        # Upstream's Azure pipeline runs on windows-2025-vs2026 (v145 ClangCL) and
        # the auto-link succeeds there. For our Phase 3 verification we only need the
        # emulator binary, not the test suite.
        run: msbuild $env:SOLUTION "/t:pcsx_redux:Build;pcsx_wrapper:Build" /p:Configuration=$env:CONFIG /p:Platform=$env:PLATFORM /p:PlatformToolset=v143 /m

      - name: Stage binaries (rename wrapper to main entry)
        shell: pwsh
        run: |
          $out = "vsprojects/$env:PLATFORM/$env:CONFIG"
          if (Test-Path "$out/pcsx-redux.exe")  { Rename-Item "$out/pcsx-redux.exe"  "pcsx-redux.main" -Force }
          if (Test-Path "$out/pcsx-wrapper.exe") { Rename-Item "$out/pcsx-wrapper.exe" "pcsx-redux.exe"   -Force }
          mkdir artifacts | Out-Null
          Copy-Item "$out/*.exe" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$out/*.dll" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$out/pcsx-redux.main" artifacts/ -ErrorAction SilentlyContinue
          if (Test-Path third_party/SDL_GameControllerDB/gamecontrollerdb.txt) {
            Copy-Item third_party/SDL_GameControllerDB/gamecontrollerdb.txt artifacts/
          }
          Copy-Item third_party/noto/* artifacts/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-redux-windows-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
