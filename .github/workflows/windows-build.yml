name: Windows CI (fork)

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      SOLUTION: vsprojects/pcsx-redux.sln
      CONFIG: ReleaseWithClangCL
      PLATFORM: x64
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore $env:SOLUTION

      - name: Build solution
        # Build via .sln targeting only the two app projects (pcsx-redux + pcsx-wrapper).
        # Direct .vcxproj invocation (CI #6) does NOT work because some sub-projects
        # (e.g. tracy.vcxproj) define only "Disabled|x64" / "Enabled|x64" as their own
        # configurations and rely on the sln-level ProjectConfigurationPlatforms mapping
        # to translate ReleaseWithClangCL|x64 to Disabled|x64. That mapping is only
        # applied when msbuild drives via the .sln metaproj.
        #
        # msbuild target naming for sln projects: project names are NOT escaped at the
        # hyphen — only %, $, @, ;, ., (, ), ' are replaced with _ per MS docs. So
        # /t:pcsx-redux:Build (with hyphen) is correct. CI #4 used /t:pcsx_redux which
        # was interpreted as a verb (no :Build suffix); CI #5 used /t:pcsx_redux:Build
        # which had a wrongly-underscored project name → MSB4057 in both cases.
        # The ":Build" suffix is required so msbuild treats the token as a project
        # specifier rather than a verb to apply across all projects.
        #
        # Test projects (testsupport / pcsxrunner / memoryleakdetector) are not refer-
        # enced by pcsx-redux or pcsx-wrapper, so they get skipped automatically and
        # we do not hit the gtest_main / LNK1561 issue.
        #
        # /p:PlatformToolset=v143 overrides v145 (VS 2026) declarations in tracy /
        # uriparser .vcxproj. The windows-2022 runner only ships v143; upstream's
        # Azure pipeline uses windows-2025-vs2026 which has v145 ClangCL.
        run: msbuild $env:SOLUTION "/t:pcsx-redux:Build;pcsx-wrapper:Build" /p:Configuration=$env:CONFIG /p:Platform=$env:PLATFORM /p:PlatformToolset=v143 /m

      - name: Stage binaries (rename wrapper to main entry)
        shell: pwsh
        run: |
          $out = "vsprojects/$env:PLATFORM/$env:CONFIG"
          if (Test-Path "$out/pcsx-redux.exe")  { Rename-Item "$out/pcsx-redux.exe"  "pcsx-redux.main" -Force }
          if (Test-Path "$out/pcsx-wrapper.exe") { Rename-Item "$out/pcsx-wrapper.exe" "pcsx-redux.exe"   -Force }
          mkdir artifacts | Out-Null
          Copy-Item "$out/*.exe" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$out/*.dll" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$out/pcsx-redux.main" artifacts/ -ErrorAction SilentlyContinue
          if (Test-Path third_party/SDL_GameControllerDB/gamecontrollerdb.txt) {
            Copy-Item third_party/SDL_GameControllerDB/gamecontrollerdb.txt artifacts/
          }
          Copy-Item third_party/noto/* artifacts/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-redux-windows-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
