name: Windows CI (fork)

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      SOLUTION: vsprojects/pcsx-redux.sln
      CONFIG: ReleaseWithClangCL
      PLATFORM: x64
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore $env:SOLUTION

      - name: Build solution
        # Build the entire .sln. Test projects (testsupport / pcsxrunner /
        # memoryleakdetector) have their .Build.0 lines removed for the
        # ReleaseWithClangCL|x64 sln config in pcsx-redux.sln so they are skipped
        # at sln-build time (equivalent to unchecking the Build column in VS's
        # Configuration Manager). They still appear in the .sln but msbuild does
        # not attempt to build them, sidestepping the gtest_main / LNK1561 issue
        # caused by ClangCL+v143 not matching the v140 googletest NuGet's auto-link.
        #
        # We tried /t: filtering to limit to pcsx-redux + pcsx-wrapper:
        #   CI #4: /t:pcsx_redux            -> MSB4057 (verb, no :Build suffix)
        #   CI #5: /t:pcsx_redux:Build      -> MSB4057 (wrong escape: hyphen kept)
        #   CI #7: /t:pcsx-redux:Build      -> MSB4057 (still not found in metaproj)
        # The .sln has a folder named "pcsx-redux" *and* a project named "pcsx-redux"
        # (the mainthunk.vcxproj), and the resulting metaproj does not generate a
        # working :Build target for that name. Skipping at the .sln config-mapping
        # level avoids the metaproj target lookup entirely.
        #
        # /p:PlatformToolset=v143 overrides v145 (VS 2026) declarations in tracy /
        # uriparser .vcxproj. windows-2022 runner only ships v143; upstream's
        # Azure pipeline uses windows-2025-vs2026 which has v145 ClangCL.
        run: msbuild $env:SOLUTION /p:Configuration=$env:CONFIG /p:Platform=$env:PLATFORM /p:PlatformToolset=v143 /m

      - name: Stage binaries (rename wrapper to main entry)
        shell: pwsh
        run: |
          $out = "vsprojects/$env:PLATFORM/$env:CONFIG"
          if (Test-Path "$out/pcsx-redux.exe")  { Rename-Item "$out/pcsx-redux.exe"  "pcsx-redux.main" -Force }
          if (Test-Path "$out/pcsx-wrapper.exe") { Rename-Item "$out/pcsx-wrapper.exe" "pcsx-redux.exe"   -Force }
          mkdir artifacts | Out-Null
          Copy-Item "$out/*.exe" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$out/*.dll" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$out/pcsx-redux.main" artifacts/ -ErrorAction SilentlyContinue
          if (Test-Path third_party/SDL_GameControllerDB/gamecontrollerdb.txt) {
            Copy-Item third_party/SDL_GameControllerDB/gamecontrollerdb.txt artifacts/
          }
          Copy-Item third_party/noto/* artifacts/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-redux-windows-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
